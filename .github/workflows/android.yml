name: MineHost Android checks and APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: minehost-android-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Restore stable signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.MINEHOST_SIGNING_BUNDLE }}
        run: |
          python - <<'PY'
          import os, json, base64, pathlib
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              raise SystemExit("Missing stable signing secret. Refusing to generate a replacement key.")
          bundle = json.loads(raw)
          print("::add-mask::" + bundle["password"], flush=True)
          path = pathlib.Path("signing/minehost.p12")
          path.parent.mkdir(exist_ok=True)
          path.write_bytes(base64.b64decode(bundle["keystore"]))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MINEHOST_STORE_PASSWORD=" + bundle["password"] + "\n")
          PY
      - name: Tests, lint and optimized ARM64 release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
      - name: Verify signing identity and non-debuggable manifest
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/SIGNATURE.txt
          EXPECTED=$(openssl x509 -in signing/minehost-certificate.pem -outform der | sha256sum | cut -d' ' -f1)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/SIGNATURE.txt)
          test "$EXPECTED" = "$ACTUAL"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > app/build/outputs/apk/release/APK-INFO.txt
          ! grep -q "application-debuggable" app/build/outputs/apk/release/APK-INFO.txt
      - name: Record source and checksum
        run: |
          git rev-parse HEAD > app/build/outputs/apk/release/SOURCE-COMMIT.txt
          sha256sum app/build/outputs/apk/release/*.apk > app/build/outputs/apk/release/SHA256SUMS.txt
          printf '%s\n' "Experimental optimized release. Stable signing from alpha.2 onward. Cannot replace alpha.1 (different key). Export and verify world/full server backups outside app storage before uninstalling alpha.1. No device performance claims. GPL-3.0-or-later." > app/build/outputs/apk/release/READ-ME-FIRST.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MineHost-ARM64-release
          path: app/build/outputs/apk/release/
          retention-days: 14
      - name: Publish verified APK to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp -f "$APK" app/build/outputs/apk/release/MineHost-1.2-arm64.apk
          if [ "$APK" != "app/build/outputs/apk/release/MineHost-arm64-v8a-release.apk" ]; then
            cp -f "$APK" app/build/outputs/apk/release/MineHost-arm64-v8a-release.apk
          fi
          sha256sum app/build/outputs/apk/release/MineHost-1.2-arm64.apk > app/build/outputs/apk/release/SHA256SUMS.txt
          NOTES='Bản chính thức **MineHost 1.2 (ARM64)**:
          - **Chơi mọi nơi qua 4G / Khác Wi-Fi (Tích hợp sẵn Playit.gg & Mạng LAN ảo ZeroTier/Tailscale):** Mở địa chỉ công khai miễn phí (*.gl.joinmc.link / ip:port) ngay trong ứng dụng chỉ với 1 chạm, không cần xác minh CCCD Trung Quốc và bạn bè không cần cài thêm app phụ. Hỗ trợ tự động nhận diện IP mạng ảo ZeroTier / Tailscale cho Map Mod nặng.
          - **Nâng Tầm Nhìn Máy Chủ lên tới 32 Chunk (View Distance & Simulation Distance Booster):** Bổ sung bộ chỉnh nhanh Tầm nhìn hiển thị (4 – 32 Chunk) và Khoảng cách mô phỏng (4 – 16 Chunk) ngay tại Quản lý máy chủ, Cấu hình và Bảng điều khiển giúp nhìn xa tới 512 ô mà không gây giật lag điện thoại.
          - **Bảng Điều Khiển & Quản Lý Pro:** Nâng cấp Bảng điều khiển với thanh trạng thái trực tiếp, bộ lọc/tìm kiếm nhật ký, 5 nhóm lệnh nhanh phân loại rõ ràng và các hộp thoại tương tác (Nâng tầm nhìn nhanh, Phát thông báo chữ lớn giữa màn hình Title/Say, Cấp OP / Đổi chế độ chơi / Kick nhanh).
          - **Đánh số phiên bản chính thức 1.2:** Chuyển sang lộ trình phiên bản chính thức 1.2, 1.3, 1.4... và hỗ trợ **cài đè trực tiếp** lên các bản trước không mất dữ liệu.'
          if gh release view v1.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.2 \
              app/build/outputs/apk/release/MineHost-1.2-arm64.apk \
              app/build/outputs/apk/release/MineHost-arm64-v8a-release.apk \
              app/build/outputs/apk/release/SHA256SUMS.txt \
              app/build/outputs/apk/release/SOURCE-COMMIT.txt \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create v1.2 \
              app/build/outputs/apk/release/MineHost-1.2-arm64.apk \
              app/build/outputs/apk/release/MineHost-arm64-v8a-release.apk \
              app/build/outputs/apk/release/SHA256SUMS.txt \
              app/build/outputs/apk/release/SOURCE-COMMIT.txt \
              --title "MineHost 1.2 - Chơi Mọi Nơi 4G/Wi-Fi (Playit.gg), Nâng Tầm Nhìn 32 Chunk & Bảng Điều Khiển Pro" \
              --notes "$NOTES" \
              --latest \
              --repo "${{ github.repository }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/
          retention-days: 7
      - name: Remove runner signing material
        if: always()
        run: rm -f signing/minehost.p12
