name: MineHost UI upgrade APK

on:
  push:
    branches: [codex/minehost-ui-refresh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minehost-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Android build components
        shell: bash
        run: |
          set -euo pipefail
          MISSING=()
          [ -d "$ANDROID_HOME/platforms/android-35" ] || MISSING+=("platforms;android-35")
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || MISSING+=("build-tools;35.0.0")
          [ -d "$ANDROID_HOME/cmake/3.22.1" ] || MISSING+=("cmake;3.22.1")
          [ -d "$ANDROID_HOME/ndk/27.0.12077973" ] || MISSING+=("ndk;27.0.12077973")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            (set +o pipefail; yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null)
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${MISSING[@]}" >/dev/null
          fi

      - name: Restore existing release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.MINEHOST_SIGNING_BUNDLE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, pathlib
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              raise SystemExit("Missing existing signing secret. No replacement key will be generated.")
          bundle = json.loads(raw)
          password = bundle["password"]
          if not password or "\n" in password or "\r" in password:
              raise SystemExit("Invalid signing password format.")
          print("::add-mask::" + password, flush=True)
          path = pathlib.Path("signing/minehost.p12")
          path.parent.mkdir(exist_ok=True)
          path.write_bytes(base64.b64decode(bundle["keystore"], validate=True))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("MINEHOST_STORE_PASSWORD=" + password + "\n")
          PY

      - name: Run regression checks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --tests "com.mineserve.mobile.server.MineoraAuditRegressionTest" --tests "com.mineserve.mobile.server.MineHostSafetyTest" --tests "com.mineserve.mobile.server.NewWorldCreationTest" --tests "com.mineserve.mobile.server.PlayableWorldPackTest" --tests "com.mineserve.mobile.server.LegacyWorldSafetyTest" --tests "com.mineserve.mobile.ui.MineHostNavigationLayoutTest" --build-cache --parallel --max-workers=4 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload UI layout checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MineHost-UI-layout-checks
          path: |
            app/build/reports/ui-layout/
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload exact app-generated Minecraft fixtures
        uses: actions/upload-artifact@v4
        with:
          name: MineHost-gameplay-fixtures
          path: app/build/generated/playable/
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK
        shell: bash
        run: |
          ./gradlew :app:assembleRelease --build-cache --parallel --max-workers=4 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Verify APK can update the previous release
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -f "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/SIGNATURE.txt
          EXPECTED=$(openssl x509 -in signing/minehost-certificate.pem -outform der | sha256sum | cut -d' ' -f1)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/SIGNATURE.txt)
          test "$EXPECTED" = "$ACTUAL"
          test "$ACTUAL" = '886ac552e731c821babfa1377138b5e722b7252bce0f732bef620ab2d0f0d295'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/minehost-previous.apk" 'https://github.com/buiduchuy2010qn-prog/minehost-android/releases/download/v2.9.8/minehost-2.9.8-arm64.apk'
          "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/minehost-previous.apk" > "$RUNNER_TEMP/minehost-previous-signature.txt"
          PREVIOUS=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/minehost-previous-signature.txt")
          test "$ACTUAL" = "$PREVIOUS"
          "$TOOLS/aapt" dump badging "$APK" > dist/APK-INFO.txt
          grep -Eq "^package: name='vn.minehost.pro' versionCode='66' versionName='2.9.9'" dist/APK-INFO.txt
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" dist/APK-INFO.txt
          ! grep -q 'application-debuggable' dist/APK-INFO.txt
          cp "$APK" dist/minehost-2.9.9-arm64.apk
          git rev-parse HEAD > dist/SOURCE-COMMIT.txt
          (cd dist && sha256sum minehost-2.9.9-arm64.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: MineHost-2.9.9-ARM64-update
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove runner signing material
        if: always()
        shell: bash
        run: rm -f -- signing/minehost.p12 "$RUNNER_TEMP/minehost-previous.apk" "$RUNNER_TEMP/minehost-previous-signature.txt"

  minecraft-gameplay:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20.4', '1.21.1', '1.21.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: MineHost-gameplay-fixtures
          path: gameplay-fixtures
      - name: Install pinned gameplay test client
        working-directory: scripts/minecraft-smoke
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test actual Minecraft gameplay and restart preservation
        env:
          # Human user explicitly accepted Minecraft EULA for temporary CI servers on 2026-10-27.
          # This is NOT consent for any server created in the Android app.
          MINEHOST_TEST_EULA_ACCEPTED: 'true'
        run: node scripts/minecraft-smoke/run.cjs "${{ matrix.minecraft }}"
      - name: Upload real Minecraft results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MineHost-gameplay-${{ matrix.minecraft }}
          path: gameplay-reports/
          if-no-files-found: warn
          retention-days: 7
